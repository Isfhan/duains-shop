name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            cd ~/domains/silver-stork-881592.hostingersite.com/duains-shop

            # Pull latest code
            git pull origin main

            # PHP dependencies (no-op fast when composer.lock unchanged)
            composer install --no-dev --prefer-dist --optimize-autoloader

            # DB migrations (additive only; instant no-op when nothing pending)
            php artisan migrate --force

            # Rebuild caches so new code/config takes effect
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Propagate config changes into Aimeos caches
            php artisan aimeos:cache || true

            # Self-healing symlink (instant if it already exists)
            php artisan storage:link || true

            # ------------------------------------------------------------
            # NOT run every deploy:

            # Frontend build — uncomment ONLY after editing resources/
            # (css/js/views) that need Tailwind/Vite:
            #   npm install && npm run build

            # One-time setup (already done on this server):
            #   php artisan key:generate --force        # only if APP_KEY empty
            #   php artisan vendor:publish --tag=config --force
            #   php artisan vendor:publish --tag=public --force
            #   chmod -R 775 storage bootstrap/cache
            # NOTE: never auto-run vendor:publish in deploys — with --force it
            # overwrites config/shop.php and public/vendor/shop.

            # IMPORTANT: APP_URL in the server .env must equal the live domain.
            # Aimeos builds all media/theme asset URLs (logo, component CSS) from
            # APP_URL; if it stays "http://localhost:8000" those links 404 on
            # production and the storefront logo/basket CSS break. Edit .env then
            # run `php artisan config:clear` (or it refreshes on the next deploy).
