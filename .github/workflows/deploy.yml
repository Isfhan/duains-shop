name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            cd ~/domains/silver-stork-881592.hostingersite.com/duains-shop

            # 1. Pull latest code (including pre-compiled public/build)
            git pull origin main

            # 2. Install PHP Dependencies without proc_open scripts
            composer install --no-dev --prefer-dist --optimize-autoloader --no-scripts

            # 3. Run Migrations
            php artisan migrate --force

            # 4. Clear & Rebuild Application Caches
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan aimeos:clear || true
            php artisan storage:link || true